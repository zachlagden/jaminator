name: Release

# Fires on any tag matching v*. Builds the MSI and attaches it to the
# corresponding GitHub Release. Lets us cut a new version with just:
#
#   git tag -s vX.Y.Z -m "..." && git push --tags
#
# instead of the manual dotnet build + wix build + gh release create dance.

on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore + build EXE
        run: dotnet build src/Jaminator/Jaminator.csproj -c Release

      - name: Install WiX 5 + UI extension
        run: |
          dotnet tool install --global wix --version 5.0.2
          wix extension add WixToolset.UI.wixext/5.0.2 --global

      - name: Build MSI
        shell: pwsh
        run: ./installer/build.ps1

      - name: Verify MSI
        shell: pwsh
        run: |
          $msi = "build/Jaminator.msi"
          if (-not (Test-Path $msi)) { throw "MSI not built" }
          $size = (Get-Item $msi).Length
          Write-Host "Built $msi ($([math]::Round($size/1KB)) KB)"

      - name: Create / update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Jaminator ${{ github.ref_name }}
          generate_release_notes: true
          files: build/Jaminator.msi
          fail_on_unmatched_files: true
